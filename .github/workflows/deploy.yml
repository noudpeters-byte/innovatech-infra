# Save as .github/workflows/deploy.yml in your repository
name: Infra CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  # Add DB_PASSWORD under Settings > Secrets and variables > Actions
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  terraform:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve

  app:
    runs-on: [self-hosted, linux]
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      # The "build" for this project is the Nginx page baked into the launch template;
      # instance_refresh rolls it out. This smoke test checks the live site answers.
      - name: Smoke test (HTTP 200 from the load balancer)
        run: |
          URL=$(terraform output -raw alb_dns_name)
          curl -f --retry 15 --retry-delay 20 --retry-all-errors --retry-connrefused "$URL"
