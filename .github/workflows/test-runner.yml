name: Terraform Deploy
on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Only apply on manual approval or if you are sure
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan